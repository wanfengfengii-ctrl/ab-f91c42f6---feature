services:
  app:
    build: .
    image: dendro-align:latest
    environment:
      # 容器内固定监听 8000；宿主机端口由 APP_PORT 控制。
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      # 宿主机端口可配置：APP_PORT=9090 docker compose up
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2); sys.exit(0 if r.status==200 and json.load(r)['status']=='ok' else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  verify:
    build: .
    image: dendro-align:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_BASE_URL: http://app:8000
    entrypoint: ["/srv/scripts/verify.sh"]
    restart: "no"
    profiles: ["verify"]
